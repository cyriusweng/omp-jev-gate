name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - run: npm run check
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: omp-jev-gate
      - uses: actions/checkout@v5
        with:
          repository: cyriusweng/omp-code-model
          ref: main
          path: omp-code-model
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run test:integration
        working-directory: omp-code-model
